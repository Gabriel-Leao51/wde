services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build: .
    command: node scripts/seed.js
    env_file:
      - .env
    volumes:
      - ./product-data/images:/usr/src/app/product-data/images
    depends_on:
      mongo:
        condition: service_healthy

  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./product-data/images:/usr/src/app/product-data/images
    depends_on:
      mongo:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  mongo-data:
